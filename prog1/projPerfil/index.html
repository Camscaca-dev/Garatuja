<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de arte</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --grid-info-size: 250px;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        body {
            display: grid;
            grid-template-areas:
                "social info content"
                "footer footer footer";
            grid-template-columns: auto var(--grid-info-size) 1fr;
            grid-template-rows: 1fr 120px;
            gap: .5rem;
            padding: .5rem;
            min-height: 100svh;
            background-repeat: no-repeat;
            background-size: cover;
        }


        aside {
            display: flex;
            flex-direction: column;
            align-items: center;
            grid-area: info;
            background-color: blue;
        }

        .thumb {
            width: calc(var(--grid-info-size) - 20px);
            height: calc(var(--grid-info-size) - 20px);
            background-color: white;
            border-radius: 35%;
            overflow: hidden;
            z-index: 2;
        }

        .thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        aside section {
            background-color: rgb(243, 222, 165);
            width: 90%;
            height: 100%;
            margin-top: -4rem;
            padding-top: 4rem;
            border-radius: 90px;
        }

        main {
            grid-area: content;
            position: relative;
            isolation: isolate;
            padding: 5rem;
        }

        main::before {
            content: "";
            background-color: rgba(155, 208, 255, 0.541);
            position: absolute;
            inset: 0;
            z-index: -1;
            border-radius: 20px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            grid-auto-rows: 120px;
            gap: .5rem;
        }

        .gallery img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
            transition: 0.3s;
        }

        .gallery img:hover {
            transform: scale(1.05);
        }

        .gallery img:nth-child(1) {
            grid-column: span 2;
            grid-row: span 2;
        }

        .gallery img:nth-child(4) {
            grid-row: span 2;
        }

        .gallery img:nth-child(7) {
            grid-column: span 2;
        }

        .gallery img:nth-child(6) {
            grid-column: span 2;
        }

        
        .gallery img:nth-child(5) {
            grid-row: span 2;
        }


        .social {
            grid-area: social;
            background-color: rgba(0, 136, 255, 0.541);

            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            gap: 20px;
            padding-bottom: 20px;
        }

        .social img {
            height: 2rem;
            width: 2rem;
            transition: 0.2s;
        }

        .social img:hover {
            transform: scale(1.2);
        }

        footer {
            grid-area: footer;
            background-color: rgba(255, 255, 255, 0.582);
            padding: 10px;
            font-size: 14px;
        }

        footer a {
            color: black;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
